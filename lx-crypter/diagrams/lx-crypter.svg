<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 662" width="960" height="662"
     role="img" aria-label="One file, two independent paths: NetZipper drops a CurveFish-packed 22.exe that delivers Remus-A; CurveFish decrypts Amadey v5.78 in memory"
     font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4590"/>
    </marker>
    <style>
      .fn   { font-size: 12.5px; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1c1e24; }
      .addr { font-size: 11px;   font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #767d8a; }
      .lbl  { font-size: 12.5px; fill: #1c1e24; }
      .ttl  { font-size: 13px; font-weight: 600; fill: #18225c; }
      .hdr  { font-size: 12px; font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; fill: #18225c; letter-spacing: 1.2px; }
      .box  { fill: #ffffff; stroke: #18225c; stroke-width: 1.5; }
      .dim  { fill: #f5f6f9; stroke: #d8dbe4; stroke-width: 1.5; }
      .ok   { fill: #eef7f2; stroke: #1f6b46; stroke-width: 1.5; }
      .inf  { fill: #fdf6e9; stroke: #b7791f; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="960" height="662" fill="#ffffff"/>

  <rect x="0" y="14" width="960" height="26" fill="#eef0f7"/>
  <text x="16" y="32" class="hdr">ONE FILE — 1,877,504 B, PURE IL, ABOUT 90% DECOY CODE</text>

  <!-- decoy entry point -->
  <rect x="20" y="58" width="560" height="64" rx="3" class="dim"/>
  <text x="300" y="80"  text-anchor="middle" class="ttl">Visible entry point — decoy</text>
  <text x="300" y="99"  text-anchor="middle" class="fn">StateofDecay.Program::Main</text>
  <text x="300" y="115" text-anchor="middle" class="addr">RVA 0x72f4 · token 0x60000fb</text>

  <line x1="582" y1="90" x2="616" y2="90" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="618" y="58" width="322" height="64" rx="3" class="dim"/>
  <text x="779" y="82"  text-anchor="middle" class="lbl">returns — the payload is never called</text>
  <text x="779" y="100" text-anchor="middle" class="lbl">from here, so a call-graph sweep reads</text>
  <text x="779" y="116" text-anchor="middle" class="lbl">the payload classes as dead code</text>

  <line x1="300" y1="124" x2="300" y2="157" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>
  <text x="312" y="144" class="addr">one oversized literal in the self-tests → OverflowException</text>

  <!-- trigger -->
  <rect x="170" y="160" width="620" height="100" rx="3" fill="#eef0f7" stroke="#18225c" stroke-width="2"/>
  <text x="480" y="182" text-anchor="middle" class="ttl">The real branch — an exception used as a conditional</text>
  <text x="480" y="199" text-anchor="middle" class="fn">StateofDecay.BigFloat::ParseWithBigInt</text>
  <text x="480" y="216" text-anchor="middle" class="addr">_parseDepth reaches 6 → (new int[6])[6] throws → the catch block is the payload</text>
  <text x="480" y="233" text-anchor="middle" class="addr">IsRunningFromCopy — aborts silently if running from %APPDATA%, %LOCALAPPDATA%,</text>
  <text x="480" y="248" text-anchor="middle" class="addr">%ProgramData% or %TEMP%</text>

  <line x1="420" y1="262" x2="262" y2="290" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>
  <line x1="540" y1="262" x2="698" y2="290" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <!-- two peers -->
  <rect x="20" y="294" width="440" height="96" rx="3" class="box"/>
  <text x="240" y="318" text-anchor="middle" class="ttl">NetZipper — extraction, no cipher</text>
  <text x="240" y="338" text-anchor="middle" class="lbl">manifest ZIP resource → %TEMP% GUID dir → unzip → launch</text>
  <text x="240" y="358" text-anchor="middle" class="addr">LX_S0C00pWGHy5bmOt.zip · 453,375 B</text>

  <rect x="500" y="294" width="440" height="96" rx="3" class="box"/>
  <text x="720" y="318" text-anchor="middle" class="ttl">CurveFish — cipher, no archive</text>
  <text x="720" y="338" text-anchor="middle" class="lbl">#US string literal → Base91 → Threefish-256-CBC, in memory</text>
  <text x="720" y="358" text-anchor="middle" class="addr">#US offset 150953 · 518,915 chars</text>
  <text x="720" y="378" text-anchor="middle" class="lbl">the helper assembly LfdReader.dll does the decrypting</text>

  <line x1="240" y1="392" x2="240" y2="411" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>
  <line x1="720" y1="392" x2="720" y2="411" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <!-- outputs -->
  <!-- outputs row -->
  <rect x="20" y="414" width="440" height="64" rx="3" class="ok"/>
  <text x="240" y="435" text-anchor="middle" class="lbl">22.exe — Win64 CurveFish build, written to disk and started</text>
  <text x="240" y="453" text-anchor="middle" class="addr">64acf136…7632 · token LX_KK050mhlf5 · reproduced byte-for-byte</text>
  <text x="240" y="468" text-anchor="middle" class="addr">packed with CurveFish (sibling build, same builder)</text>

  <rect x="500" y="414" width="440" height="64" rx="3" class="ok"/>
  <text x="720" y="438" text-anchor="middle" class="lbl">Amadey v5.78 — decrypted in memory, 421,888 B</text>
  <text x="720" y="459" text-anchor="middle" class="addr">dce69e09…ac55 · reproduced byte-for-byte</text>

  <!-- 22.exe re-uses the same exception entry point -->
  <line x1="240" y1="480" x2="240" y2="498" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="20" y="500" width="440" height="56" rx="3" class="dim"/>
  <text x="240" y="521" text-anchor="middle" class="ttl">Same entry point, same builder</text>
  <text x="240" y="539" text-anchor="middle" class="fn">StateofDecay.BigFloat::ParseWithBigInt</text>
  <text x="240" y="552" text-anchor="middle" class="addr">CurveFish layer decrypts Remus-A in memory · token LX_KK050mhlf5</text>

  <!-- Remus-A, delivered by 22.exe -->
  <line x1="240" y1="558" x2="240" y2="576" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#s)"/>

  <rect x="20" y="578" width="440" height="64" rx="3" class="inf"/>
  <text x="240" y="599" text-anchor="middle" class="lbl">Remus-A — decrypted in memory by 22.exe</text>
  <text x="240" y="617" text-anchor="middle" class="addr">a0889124…ba7e · identified separately, not reproduced here</text>
  <text x="240" y="632" text-anchor="middle" class="addr">process-hollows into MSBuild.exe (per setup article)</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
