<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" width="960" height="604"
     role="img" aria-label="The FishCrypter cipher chain from an in-file string literal to an Amadey PE decrypted in memory"
     font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4590"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/>
    </marker>
    <style>
      .ttl  { font-size: 12.5px; font-weight: 600; fill: #18225c; }
      .fn   { font-size: 11.5px; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1c1e24; }
      .addr { font-size: 11px;   font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #767d8a; }
      .sm   { font-size: 10.5px; font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; fill: #1c1e24; }
      .smg  { font-size: 10.5px; font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; fill: #767d8a; }
      .num  { font-size: 11px; font-weight: 600; fill: #ffffff; }
      .hdr  { font-size: 12px; font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; fill: #18225c; letter-spacing: 1.2px; }
      .lbl  { font-size: 12.5px; fill: #1c1e24; }
      .box  { fill: #ffffff; stroke: #18225c; stroke-width: 1.5; }
      .sub  { fill: #f5f6f9; stroke: #d8dbe4; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="960" height="604" fill="#ffffff"/>

  <rect x="0" y="14" width="960" height="26" fill="#eef0f7"/>
  <text x="16" y="32" class="hdr">FISHCRYPTER — A STRING LITERAL IN THIS FILE TO AN AMADEY PE, ENTIRELY IN MEMORY</text>

  <!-- row A: steps 1-3 -->
  <rect x="20" y="56" width="290" height="80" rx="3" class="box"/>
  <circle cx="40" cy="76" r="11" fill="#18225c"/><text x="40" y="80" text-anchor="middle" class="num">1</text>
  <text x="58" y="80" class="ttl">Read the helper resource</text>
  <text x="30" y="100" class="fn">manifest resource LfdReader.dll</text>
  <text x="30" y="116" class="addr">70,656 B · SHA-256 2f11f4c6…</text>
  <text x="30" y="131" class="addr">real identity IBar2Double 1.0.0.0</text>

  <line x1="312" y1="96" x2="332" y2="96" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="335" y="56" width="290" height="80" rx="3" class="box"/>
  <circle cx="355" cy="76" r="11" fill="#18225c"/><text x="355" y="80" text-anchor="middle" class="num">2</text>
  <text x="373" y="80" class="ttl">Load it and resolve the type</text>
  <text x="345" y="100" class="fn">Assembly.Load → GetType</text>
  <text x="345" y="116" class="fn">IBar2Double.ADXPlot</text>
  <text x="345" y="131" class="addr">via MachinePart::InvokeViaILVoid</text>

  <line x1="627" y1="96" x2="647" y2="96" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="650" y="56" width="290" height="80" rx="3" class="box"/>
  <circle cx="670" cy="76" r="11" fill="#18225c"/><text x="670" y="80" text-anchor="middle" class="num">3</text>
  <text x="688" y="80" class="ttl">Call the cipher entry point</text>
  <text x="660" y="100" class="fn">ADXPlot::Benchmark(ct, pw)</text>
  <text x="660" y="116" class="addr">#US offset 150953 · 518,915 chars</text>
  <text x="660" y="131" class="addr">password in plaintext, same binary</text>

  <line x1="795" y1="138" x2="795" y2="163" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <!-- row B: steps 4-5 and 6 -->
  <rect x="20" y="166" width="440" height="106" rx="3" class="box"/>
  <circle cx="40" cy="186" r="11" fill="#18225c"/><text x="40" y="190" text-anchor="middle" class="num">4</text>
  <circle cx="66" cy="186" r="11" fill="#18225c"/><text x="66" y="190" text-anchor="middle" class="num">5</text>
  <text x="86" y="190" class="ttl">The constant table — CryptoObfuscator</text>
  <text x="30" y="212" class="fn">A.ConstTable_IBar2DoublePercent::.cctor</text>
  <text x="30" y="229" class="addr">resource IBar2Double% (Base64 SUJhcjJEb3VibGUl)</text>
  <text x="30" y="245" class="addr">flags word inverted · bit 0x2 → DES-CBC, IV first</text>
  <text x="30" y="261" class="addr">bit 0x8 → Deflate · offsets {0,4,8,20,32,36,40,84,88}</text>

  <line x1="462" y1="219" x2="494" y2="219" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="500" y="166" width="440" height="106" rx="3" class="box"/>
  <circle cx="520" cy="186" r="11" fill="#18225c"/><text x="520" y="190" text-anchor="middle" class="num">6</text>
  <text x="540" y="190" class="ttl">Base91 decode, then slice the blob</text>
  <text x="510" y="212" class="fn">IBar2Double.Base91::Decode · DecTab</text>
  <text x="510" y="229" class="addr">non-hyphenated 91-character alphabet</text>
  <text x="510" y="245" class="addr">salt @0, 16 B · IV @16, 32 B · payload @48</text>
  <text x="510" y="261" class="addr">verified against the compiled table, byte for byte</text>

  <line x1="720" y1="274" x2="720" y2="287" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <!-- row C: step 7 -->
  <rect x="20" y="290" width="920" height="96" rx="3" class="box"/>
  <circle cx="40" cy="310" r="11" fill="#18225c"/><text x="40" y="314" text-anchor="middle" class="num">7</text>
  <text x="58" y="314" class="ttl">Derive the Threefish key — ADXPlot::BuildThreefishKey</text>
  <text x="58" y="330" class="addr">the self-DH step — a shared secret from one's own scalar and one's own public point — is the unusual part</text>

  <rect x="29" y="336" width="134" height="40" rx="3" class="sub"/>
  <text x="96" y="352" text-anchor="middle" class="sm">PBKDF2-SHA1</text>
  <text x="96" y="367" text-anchor="middle" class="smg">100,000 · dklen 32</text>
  <line x1="165" y1="356" x2="179" y2="356" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="181" y="336" width="134" height="40" rx="3" class="sub"/>
  <text x="248" y="352" text-anchor="middle" class="sm">SHA-256</text>
  <text x="248" y="367" text-anchor="middle" class="smg">of that output</text>
  <line x1="317" y1="356" x2="331" y2="356" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="333" y="336" width="134" height="40" rx="3" class="sub"/>
  <text x="400" y="352" text-anchor="middle" class="sm">Donna32.Harden</text>
  <text x="400" y="367" text-anchor="middle" class="smg">not RFC 7748</text>
  <line x1="469" y1="356" x2="483" y2="356" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="485" y="336" width="134" height="40" rx="3" class="sub"/>
  <text x="552" y="352" text-anchor="middle" class="sm">X25519</text>
  <text x="552" y="367" text-anchor="middle" class="smg">scalar base-mult</text>
  <line x1="621" y1="356" x2="635" y2="356" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="637" y="336" width="134" height="40" rx="3" class="sub"/>
  <text x="704" y="352" text-anchor="middle" class="sm">X25519</text>
  <text x="704" y="367" text-anchor="middle" class="smg">self-DH</text>
  <line x1="773" y1="356" x2="787" y2="356" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="789" y="336" width="134" height="40" rx="3" fill="#eef7f2" stroke="#1f6b46" stroke-width="1.2"/>
  <text x="856" y="352" text-anchor="middle" class="sm">SHA-256</text>
  <text x="856" y="367" text-anchor="middle" class="smg">= the key</text>

  <line x1="300" y1="388" x2="300" y2="401" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <!-- row D: steps 8-9 -->
  <rect x="20" y="404" width="560" height="76" rx="3" class="box"/>
  <circle cx="40" cy="424" r="11" fill="#18225c"/><text x="40" y="428" text-anchor="middle" class="num">8</text>
  <text x="58" y="428" class="ttl">Threefish-256 CBC decrypt, then PKCS7 unpad</text>
  <text x="30" y="450" class="fn">IBar2Double.Threefish256::Decrypt</text>
  <text x="30" y="468" class="addr">72 rounds · standard TF_ROT table · C240 tweak constant</text>

  <line x1="582" y1="442" x2="614" y2="442" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="620" y="404" width="320" height="76" rx="3" fill="#eef7f2" stroke="#1f6b46" stroke-width="1.5"/>
  <circle cx="640" cy="424" r="11" fill="#1f6b46"/><text x="640" y="428" text-anchor="middle" class="num">9</text>
  <text x="658" y="428" class="ttl">Amadey v5.78 PE, in memory</text>
  <text x="630" y="450" class="addr">dce69e096e6b7a54…fd43ac55</text>
  <text x="630" y="468" class="addr">421,888 B · reproduced byte-for-byte</text>

  <line x1="300" y1="482" x2="300" y2="495" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>
  <line x1="760" y1="482" x2="760" y2="495" stroke="#8a5a00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d)"/>

  <!-- row E: steps 10-11 -->
  <rect x="20" y="498" width="440" height="92" rx="3" class="box"/>
  <circle cx="40" cy="518" r="11" fill="#18225c"/><text x="40" y="522" text-anchor="middle" class="num">10</text>
  <text x="62" y="522" class="ttl">Write the path marker</text>
  <text x="30" y="544" class="fn">stub_exe.dat</text>
  <text x="30" y="562" class="addr">%LOCALAPPDATA%\Microsoft\Windows\Caches\</text>
  <text x="30" y="578" class="addr">%TEMP%\BrightInfo\cache\ · holds its own full path</text>

  <rect x="500" y="498" width="440" height="92" rx="3" fill="#fdf6e6" stroke="#8a5a00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="520" cy="518" r="11" fill="#8a5a00"/><text x="520" y="522" text-anchor="middle" class="num">11</text>
  <text x="542" y="522" class="ttl">Gated hollowing call — never shown to fire</text>
  <text x="510" y="544" class="fn">MachinePart::InvokeViaILVoid → "Run"</text>
  <text x="510" y="562" class="addr">…\Microsoft.NET\Framework64\v4.0.30319\MSBuild.exe</text>
  <text x="510" y="578" class="addr">gate AAPoly::CrestronSize has no assignment site</text>
</svg>