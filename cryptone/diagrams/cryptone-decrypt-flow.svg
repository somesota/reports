<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .label { font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .sublabel { fill: #475569; text-anchor: middle; font-size: 11; }
    .note { fill: #64748b; font-size: 11; font-style: italic; text-anchor: middle; }
    .connector { stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- Background -->
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">CryptOne — resource decryption flow</text>

  <!-- Step 1: Resource load -->
  <rect x="30" y="55" width="160" height="70" class="box" fill="none" stroke="#3b82f6"/>
  <text x="110" y="82" class="label">Resource load</text>
  <text x="110" y="98" class="sublabel">FindResourceA</text>
  <text x="110" y="112" class="sublabel">type: rtirtwerqq</text>

  <!-- Arrow 1→2 -->
  <line x1="190" y1="90" x2="230" y2="90" class="connector" stroke="#64748b"/>

  <!-- Step 2: De-interleave -->
  <rect x="230" y="55" width="160" height="70" class="box" fill="none" stroke="#3b82f6"/>
  <text x="310" y="78" class="label">Stage 1</text>
  <text x="310" y="94" class="sublabel">De-interleave</text>
  <text x="310" y="108" class="sublabel">keep data / skip junk</text>

  <!-- Arrow 2→delay1 -->
  <line x1="390" y1="90" x2="430" y2="90" class="connector" stroke="#64748b"/>

  <!-- Delay 1 -->
  <rect x="430" y="55" width="120" height="70" class="box" fill="none" stroke="#dc2626" stroke-dasharray="5,3"/>
  <text x="490" y="82" class="label" fill="#dc2626">CPU burn</text>
  <text x="490" y="98" class="sublabel" fill="#991b1b">~32M iterations</text>
  <text x="490" y="112" class="sublabel" fill="#991b1b">StrokePath(NULL)</text>

  <!-- Arrow delay1→3 -->
  <line x1="550" y1="90" x2="590" y2="90" class="connector" stroke="#64748b"/>

  <!-- Step 3: Decrypt -->
  <rect x="590" y="55" width="160" height="70" class="box" fill="none" stroke="#3b82f6"/>
  <text x="670" y="78" class="label">Stage 2</text>
  <text x="670" y="94" class="sublabel">Add-then-XOR</text>
  <text x="670" y="108" class="sublabel">static key</text>

  <!-- Arrow 3→delay2 -->
  <line x1="750" y1="90" x2="790" y2="90" class="connector" stroke="#64748b"/>

  <!-- Delay 2 -->
  <rect x="790" y="55" width="120" height="70" class="box" fill="none" stroke="#dc2626" stroke-dasharray="5,3"/>
  <text x="850" y="82" class="label" fill="#dc2626">CPU burn</text>
  <text x="850" y="98" class="sublabel" fill="#991b1b">~32M iterations</text>
  <text x="850" y="112" class="sublabel" fill="#991b1b">StrokePath(NULL)</text>

  <!-- Arrow delay2 down to tail jump -->
  <path d="M850,125 L850,160 L540,160 L540,190" class="connector" stroke="#64748b"/>

  <!-- Step 4: Target computation -->
  <rect x="430" y="190" width="220" height="60" class="box" fill="none" stroke="#16a34a"/>
  <text x="540" y="215" class="label">Target computation</text>
  <text x="540" y="231" class="sublabel">base + 0x2D4A4 → [EBP-0x14]</text>

  <!-- Arrow 4→5 -->
  <line x1="540" y1="250" x2="540" y2="280" class="connector" stroke="#64748b"/>

  <!-- Step 5: Tail-jump -->
  <rect x="430" y="280" width="220" height="60" class="box" fill="none" stroke="#ca8a04"/>
  <text x="540" y="305" class="label">Stage 3 — tail-jump</text>
  <text x="540" y="321" class="sublabel">PUSH target; RET</text>

  <!-- Arrow 5→payload -->
  <path d="M540,340 L540,370" class="connector" stroke="#64748b" marker-end="url(#arrow-red)"/>

  <!-- Payload (out of scope) -->
  <rect x="430" y="370" width="220" height="50" class="box" fill="none" stroke="#94a3b8" stroke-dasharray="5,3"/>
  <text x="540" y="395" class="label" fill="#94a3b8">Decrypted PE payload</text>
  <text x="540" y="411" class="note">out of scope</text>

  <!-- Detail boxes -->
  <!-- De-interleave detail -->
  <rect x="30" y="170" width="350" height="115" rx="4" ry="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <text x="205" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">De-interleave detail</text>
  <text x="45" y="208" font-size="11" fill="#475569" font-family="'Cascadia Code','Fira Code',monospace">for (src = 0; src &lt; totalSize; src += stride)</text>
  <text x="45" y="224" font-size="11" fill="#475569" font-family="'Cascadia Code','Fira Code',monospace">  memcpy(dst, raw + src, data_block)</text>
  <text x="45" y="244" font-size="11" fill="#64748b">Stride: data block + junk block</text>
  <text x="45" y="260" font-size="11" fill="#64748b">First 4 bytes of output = payload length prefix</text>
  <text x="45" y="276" font-size="11" fill="#64748b">Resource entropy: 7.20 → structured noise pattern</text>

  <!-- Decrypt detail -->
  <rect x="30" y="300" width="350" height="95" rx="4" ry="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <text x="205" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Per-word cipher detail</text>
  <text x="45" y="340" font-size="11" fill="#475569" font-family="'Cascadia Code','Fira Code',monospace">pt[i] = (ct[i] + i) XOR (i + KEY)</text>
  <text x="45" y="360" font-size="11" fill="#64748b">KEY = static build key (split across two addends)</text>
  <text x="45" y="376" font-size="11" fill="#64748b">4 junk StrokePath(0) calls per iteration</text>
  <text x="45" y="388" font-size="11" fill="#64748b">Fully static — offline decryption possible</text>

  <!-- Legend -->
  <rect x="30" y="445" width="900" height="55" rx="4" ry="4" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="462" width="20" height="12" rx="2" fill="none" stroke="#3b82f6" stroke-width="1"/>
  <text x="78" y="473" font-size="11" fill="#475569">Core pipeline stage</text>
  <rect x="210" y="462" width="20" height="12" rx="2" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="238" y="473" font-size="11" fill="#475569">Anti-analysis delay</text>
  <rect x="380" y="462" width="20" height="12" rx="2" fill="none" stroke="#16a34a" stroke-width="1"/>
  <text x="408" y="473" font-size="11" fill="#475569">Address computation</text>
  <rect x="560" y="462" width="20" height="12" rx="2" fill="none" stroke="#ca8a04" stroke-width="1"/>
  <text x="588" y="473" font-size="11" fill="#475569">Control transfer</text>
  <rect x="730" y="462" width="20" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="758" y="473" font-size="11" fill="#475569">Out of scope</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>