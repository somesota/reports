<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .label { font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .sublabel { fill: #475569; text-anchor: middle; font-size: 11; }
    .addr { fill: #6366f1; font-family: 'Cascadia Code','Fira Code',monospace; font-size: 10; text-anchor: middle; }
    .conn { stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .note { fill: #64748b; font-size: 11; font-style: italic; }
  </style>

  <!-- Background -->
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">CryptOne — startup hijack sequence</text>

  <!-- Normal Delphi startup path (top row) -->
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#64748b">Normal Delphi VCL startup path</text>

  <!-- PE entry -->
  <rect x="30" y="70" width="140" height="55" class="box" fill="none" stroke="#94a3b8"/>
  <text x="100" y="93" class="label" fill="#64748b">PE entry point</text>
  <text x="100" y="109" class="addr">0x0045D478</text>

  <!-- Arrow -->
  <line x1="170" y1="97" x2="220" y2="97" class="conn" stroke="#64748b"/>

  <!-- Application.Initialize -->
  <rect x="220" y="70" width="170" height="55" class="box" fill="none" stroke="#94a3b8"/>
  <text x="305" y="93" class="label" fill="#64748b">Application.Initialize</text>
  <text x="305" y="109" class="sublabel">Framework setup</text>

  <!-- Arrow -->
  <line x1="390" y1="97" x2="440" y2="97" class="conn" stroke="#64748b"/>

  <!-- Application.CreateForm -->
  <rect x="440" y="70" width="190" height="55" class="box" fill="none" stroke="#ca8a04"/>
  <text x="535" y="93" class="label">Application.CreateForm</text>
  <text x="535" y="109" class="addr">0x0045D4A7</text>

  <!-- Arrow to what would be next (greyed out) -->
  <line x1="630" y1="97" x2="680" y2="97" stroke="#d1d5db" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>

  <!-- Application.Run (never reached) -->
  <rect x="680" y="70" width="160" height="55" class="box" fill="none" stroke="#d1d5db" stroke-dasharray="5,3"/>
  <text x="760" y="93" class="label" fill="#d1d5db">Application.Run</text>
  <text x="760" y="109" class="sublabel" fill="#d1d5db">Never reached ✕</text>

  <!-- Hijack arrow down from CreateForm -->
  <path d="M535,125 L535,175" class="conn" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="555" y="155" font-size="11" font-weight="600" fill="#dc2626">hijack</text>

  <!-- FormCreate (the malicious handler) -->
  <rect x="380" y="175" width="310" height="65" class="box" fill="none" stroke="#dc2626"/>
  <text x="535" y="198" class="label" fill="#991b1b">FormCreate handler</text>
  <text x="535" y="214" class="sublabel" fill="#991b1b">The entire sample — never returns</text>
  <text x="535" y="228" class="addr">0x0045CE08</text>

  <!-- Arrow down to the pipeline -->
  <path d="M535,240 L535,270" class="conn" stroke="#dc2626" marker-end="url(#arr-red)"/>

  <!-- Pipeline summary row -->
  <rect x="80" y="270" width="140" height="50" class="box" fill="none" stroke="#3b82f6"/>
  <text x="150" y="293" class="label" font-size="12">Resource load</text>
  <text x="150" y="307" class="sublabel">rtirtwerqq</text>

  <line x1="220" y1="295" x2="260" y2="295" class="conn" stroke="#64748b"/>

  <rect x="260" y="270" width="120" height="50" class="box" fill="none" stroke="#3b82f6"/>
  <text x="320" y="293" class="label" font-size="12">De-interleave</text>
  <text x="320" y="307" class="sublabel">data / junk</text>

  <line x1="380" y1="295" x2="420" y2="295" class="conn" stroke="#64748b"/>

  <rect x="420" y="270" width="120" height="50" class="box" fill="none" stroke="#3b82f6"/>
  <text x="480" y="293" class="label" font-size="12">Decrypt</text>
  <text x="480" y="307" class="sublabel">add + XOR</text>

  <line x1="540" y1="295" x2="580" y2="295" class="conn" stroke="#64748b"/>

  <rect x="580" y="270" width="120" height="50" class="box" fill="none" stroke="#ca8a04"/>
  <text x="640" y="293" class="label" font-size="12">Tail-jump</text>
  <text x="640" y="307" class="sublabel">PUSH/RET</text>

  <line x1="700" y1="295" x2="740" y2="295" class="conn" stroke="#64748b" marker-end="url(#arr-red)"/>

  <rect x="740" y="270" width="130" height="50" class="box" fill="none" stroke="#94a3b8" stroke-dasharray="5,3"/>
  <text x="805" y="293" class="label" fill="#94a3b8">Payload PE</text>
  <text x="805" y="307" class="sublabel" fill="#94a3b8">out of scope</text>

  <!-- Annotations -->
  <rect x="30" y="350" width="900" height="55" rx="4" ry="4" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="370" class="note">Key point: the malicious logic fires at form creation time — the earliest event the Delphi VCL framework exposes to application code.</text>
  <text x="50" y="388" class="note">The handler never returns. No window is shown, no message loop runs. The GUI framework is a delivery vehicle, not a feature.</text>
</svg>