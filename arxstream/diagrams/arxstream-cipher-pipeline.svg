<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700"
     role="img" aria-label="The arxstream cipher pipeline: three key-schedule stages, a warm-up, and two passes over the ciphertext"
     font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4590"/>
    </marker>
    <style>
      .fn   { font-size: 12px;   font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1c1e24; }
      .addr { font-size: 11px;   font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #767d8a; }
      .lbl  { font-size: 13px;   fill: #1c1e24; }
      .sub  { font-size: 12px;   fill: #4a5060; }
      .hdr  { font-size: 12px;   font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; fill: #18225c; letter-spacing: 1.2px; }
      .hdrG { font-size: 12px;   font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; fill: #1f6b46; letter-spacing: 1.2px; }
      .box  { fill: #ffffff; stroke: #18225c; stroke-width: 1.5; }
      .boxK { fill: #f5f6f9; stroke: #18225c; stroke-width: 1.5; }
      .boxG { fill: #eef7f2; stroke: #1f6b46; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="960" height="700" fill="#ffffff"/>

  <rect x="0" y="14" width="960" height="26" fill="#eef0f7"/>
  <text x="16" y="32" class="hdr">INPUTS — ONE PER-BUILD SECRET, TWO FIXED SCHEME CONSTANTS</text>

  <rect x="20" y="54" width="280" height="68" rx="3" class="boxK"/>
  <text x="160" y="78" text-anchor="middle" class="lbl">128-byte master key</text>
  <text x="160" y="97" text-anchor="middle" class="sub">rotates with every build</text>
  <text x="160" y="114" text-anchor="middle" class="addr">0x14007b000</text>

  <rect x="340" y="54" width="280" height="68" rx="3" class="boxK"/>
  <text x="480" y="78" text-anchor="middle" class="lbl">constant table A, 32 bytes</text>
  <text x="480" y="97" text-anchor="middle" class="sub">scheme constant, not a secret</text>
  <text x="480" y="114" text-anchor="middle" class="addr">0x140077000</text>

  <rect x="660" y="54" width="280" height="68" rx="3" class="boxK"/>
  <text x="800" y="78" text-anchor="middle" class="lbl">constant table B, 32 bytes</text>
  <text x="800" y="97" text-anchor="middle" class="sub">contiguous with A in .rdata</text>
  <text x="800" y="114" text-anchor="middle" class="addr">0x140077020</text>

  <line x1="160" y1="124" x2="160" y2="180" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>
  <line x1="480" y1="124" x2="480" y2="180" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>
  <line x1="800" y1="124" x2="800" y2="180" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="0" y="146" width="960" height="26" fill="#eef0f7"/>
  <text x="16" y="164" class="hdr">KEY SCHEDULE — THREE STAGES, ALL THREE FED BY THE KEY AND BOTH TABLES</text>

  <rect x="20" y="186" width="280" height="112" rx="3" class="box"/>
  <text x="160" y="208" text-anchor="middle" class="lbl">256-byte S-box</text>
  <text x="160" y="228" text-anchor="middle" class="sub">1024-round RC4-style KSA,</text>
  <text x="160" y="245" text-anchor="middle" class="sub">then 8 rounds of GF(2^8) x^254</text>
  <text x="160" y="262" text-anchor="middle" class="sub">inverse and 0x63 whitening</text>
  <text x="160" y="281" text-anchor="middle" class="fn">derive_sbox_permutation</text>
  <text x="160" y="295" text-anchor="middle" class="addr">0x1400758c0</text>

  <rect x="340" y="186" width="280" height="112" rx="3" class="box"/>
  <text x="480" y="208" text-anchor="middle" class="lbl">32-byte subkey</text>
  <text x="480" y="228" text-anchor="middle" class="sub">SHA-256 IV words as ARX seeds,</text>
  <text x="480" y="245" text-anchor="middle" class="sub">2 custom rounds, cross-mix with</text>
  <text x="480" y="262" text-anchor="middle" class="sub">both tables, nibbles forced |0x10</text>
  <text x="480" y="281" text-anchor="middle" class="fn">derive_subkey32_kdf</text>
  <text x="480" y="295" text-anchor="middle" class="addr">0x140074f90</text>

  <rect x="660" y="186" width="280" height="112" rx="3" class="box"/>
  <text x="800" y="208" text-anchor="middle" class="lbl">four state buffers</text>
  <text x="800" y="228" text-anchor="middle" class="sub">1024 / 256 / 128 / 256 bytes from</text>
  <text x="800" y="245" text-anchor="middle" class="sub">a 12-round ARX loop stepping</text>
  <text x="800" y="262" text-anchor="middle" class="sub">0..0x100 by 0x20</text>
  <text x="800" y="281" text-anchor="middle" class="fn">derive_keystream_material</text>
  <text x="800" y="295" text-anchor="middle" class="addr">0x140072110</text>

  <polyline points="160,300 160,318 480,318 480,336" fill="none" stroke="#3a4590" stroke-width="1.5"/>
  <polyline points="800,300 800,318 480,318" fill="none" stroke="#3a4590" stroke-width="1.5"/>
  <line x1="480" y1="318" x2="480" y2="352" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="0" y="330" width="960" height="26" fill="#eef0f7"/>
  <text x="16" y="348" class="hdr">KEYSTREAM AND OUTPUT</text>

  <rect x="20" y="368" width="920" height="58" rx="3" class="box"/>
  <text x="480" y="392" text-anchor="middle" class="lbl">512-round warm-up &#8212; scrambles the 1024-byte buffer, touches no ciphertext</text>
  <text x="480" y="414" text-anchor="middle" class="addr">inline in stream_cipher_decrypt_stage2, 0x140073be0</text>

  <line x1="240" y1="428" x2="240" y2="460" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="20" y="464" width="440" height="88" rx="3" class="box"/>
  <text x="240" y="488" text-anchor="middle" class="lbl">pass 1 &#8212; keystream XOR</text>
  <text x="240" y="508" text-anchor="middle" class="sub">one generated byte XORed onto each</text>
  <text x="240" y="525" text-anchor="middle" class="sub">of the 1,157,120 ciphertext bytes</text>
  <text x="240" y="544" text-anchor="middle" class="addr">keystream_output_byte, 0x140074d90</text>

  <line x1="462" y1="508" x2="496" y2="508" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="500" y="464" width="440" height="88" rx="3" class="box"/>
  <text x="720" y="488" text-anchor="middle" class="lbl">pass 2 &#8212; whitening</text>
  <text x="720" y="508" text-anchor="middle" class="sub">a second full pass over the same bytes,</text>
  <text x="720" y="525" text-anchor="middle" class="sub">whose last two terms combine by ADDITION</text>
  <text x="720" y="544" text-anchor="middle" class="addr">inline, 0x140073be0</text>

  <line x1="720" y1="554" x2="720" y2="584" stroke="#3a4590" stroke-width="1.5"/>
  <polyline points="720,584 480,584 480,600" fill="none" stroke="#3a4590" stroke-width="1.5" marker-end="url(#s)"/>

  <rect x="240" y="604" width="480" height="66" rx="3" class="boxG"/>
  <text x="480" y="628" text-anchor="middle" class="lbl">plaintext PE32+ &#8212; a Vidar stealer, 1,157,120 bytes</text>
  <text x="480" y="649" text-anchor="middle" class="fn">9b316a492b05&#8230;e47455</text>
  <text x="480" y="664" text-anchor="middle" class="addr">reproduced byte-identically across two emulator runs</text>
</svg>
