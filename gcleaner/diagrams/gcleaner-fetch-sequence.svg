<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img">
<title>GCleaner loader fetch and registration sequence</title>
<desc>The victim host fetches a Google Drive redirector URL and receives an encrypted C2 hostname, decodes it with a local substitution cipher, registers the install with GET /success, fetches password bytes from /info and an AES-encrypted PE from /update, derives the key, decrypts, maps the PE in-process and calls its updateSW export.</desc>
<style>
.t{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;fill:#1c1e24}
.b{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#1c1e24}
.s{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#4a4f5c}
.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#1c1e24}
.a{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#8a5a00}
.n{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:#ffffff}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4590"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#767d8a"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker></defs>
<rect x="0" y="0" width="960" height="660" fill="#ffffff"/>
<rect x="30" y="20" width="240" height="44" rx="8" stroke="#18225c" stroke-width="1.6" fill="#ffffff"/>
<text x="150.0" y="47.0" class="b" text-anchor="middle">Victim host (loader)</text>
<line x1="150" y1="64" x2="150" y2="640" stroke="#767d8a" stroke-width="1.2" stroke-dasharray="3 5"/>
<rect x="360" y="20" width="240" height="44" rx="8" stroke="#18225c" stroke-width="1.6" fill="#ffffff"/>
<text x="480.0" y="47.0" class="b" text-anchor="middle">Google Drive (HTTPS)</text>
<line x1="480" y1="64" x2="480" y2="640" stroke="#767d8a" stroke-width="1.2" stroke-dasharray="3 5"/>
<rect x="690" y="20" width="240" height="44" rx="8" stroke="#18225c" stroke-width="1.6" fill="#ffffff"/>
<text x="810.0" y="47.0" class="b" text-anchor="middle">C2 host</text>
<line x1="810" y1="64" x2="810" y2="640" stroke="#767d8a" stroke-width="1.2" stroke-dasharray="3 5"/>
<circle cx="172" cy="92" r="11" fill="#18225c"/><text x="172" y="96.5" class="n" text-anchor="middle">1</text>
<line x1="150" y1="110" x2="480" y2="110" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="325.0" y="102" class="t" text-anchor="middle">GET redirector URL</text>
<circle cx="458" cy="142" r="11" fill="#18225c"/><text x="458" y="146.5" class="n" text-anchor="middle">2</text>
<line x1="480" y1="160" x2="150" y2="160" stroke="#767d8a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/>
<text x="315.0" y="152" class="t" text-anchor="middle">encrypted C2 hostname string</text>
<rect x="40" y="190" width="330" height="34" rx="4" fill="#f4f5f8" stroke="#767d8a"/><text x="205" y="212" class="s" text-anchor="middle">decode via local substitution cipher</text>
<circle cx="172" cy="252" r="11" fill="#8a5a00"/><text x="172" y="256.5" class="n" text-anchor="middle">3</text>
<line x1="150" y1="270" x2="810" y2="270" stroke="#8a5a00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aa)"/>
<text x="480.0" y="262" class="a" text-anchor="middle">GET /success  (substr, sub, s)  (HTTP)</text>
<text x="480.0" y="288" class="a" text-anchor="middle">registration — in recovered configuration, not traced in disassembly</text>
<circle cx="172" cy="322" r="11" fill="#18225c"/><text x="172" y="326.5" class="n" text-anchor="middle">4</text>
<line x1="150" y1="340" x2="810" y2="340" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="480.0" y="332" class="t" text-anchor="middle">GET /info  (HTTP)</text>
<circle cx="788" cy="367" r="11" fill="#18225c"/><text x="788" y="371.5" class="n" text-anchor="middle">5</text>
<line x1="810" y1="385" x2="150" y2="385" stroke="#767d8a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/>
<text x="480.0" y="377" class="t" text-anchor="middle">password bytes</text>
<circle cx="172" cy="422" r="11" fill="#18225c"/><text x="172" y="426.5" class="n" text-anchor="middle">6</text>
<line x1="150" y1="440" x2="810" y2="440" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="480.0" y="432" class="t" text-anchor="middle">GET /update  (HTTP)</text>
<circle cx="788" cy="467" r="11" fill="#18225c"/><text x="788" y="471.5" class="n" text-anchor="middle">7</text>
<line x1="810" y1="485" x2="150" y2="485" stroke="#767d8a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/>
<text x="480.0" y="477" class="t" text-anchor="middle">AES-encrypted PE</text>
<rect x="40" y="515" width="600" height="34" rx="4" fill="#f4f5f8" stroke="#767d8a"/><text x="340" y="537" class="s" text-anchor="middle">derive AES key from password, decrypt PE (parameters withheld — Restricted)</text>
<rect x="40" y="565" width="600" height="34" rx="4" fill="#f4f5f8" stroke="#767d8a"/><text x="340" y="587" class="s" text-anchor="middle">validate/map PE in-process, call "updateSW" export</text>
</svg>
