<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>GCleaner payload decryption and reflective-load pipeline</title>
<desc>Two HTTP responses enter the pipeline: the /info response is widened to UTF-16LE, SHA-256 hashed and truncated to produce the AES key; the /update response is AES-128-CBC decrypted with that key. The plaintext PE is then validated, mapped in-process through a hand-rolled reflective loader, and the updateSW export is resolved and called.</desc>
<style>
.t{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;fill:#1c1e24}
.b{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#1c1e24}
.s{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#4a4f5c}
.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#1c1e24}
.a{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#8a5a00}
.n{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:#ffffff}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4590"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#767d8a"/></marker></defs>
<rect x="0" y="0" width="960" height="720" fill="#ffffff"/>

<!-- Left stream: /info → key derivation -->
<rect x="60" y="20" width="340" height="50" rx="8" stroke="#18225c" stroke-width="1.6" fill="#ffffff"/>
<text x="230" y="42" class="b" text-anchor="middle">/info response body</text>
<text x="230" y="57" class="s" text-anchor="middle">raw bytes, no parsing</text>

<circle cx="82" cy="96" r="11" fill="#18225c"/><text x="82" y="100.5" class="n" text-anchor="middle">1</text>
<line x1="230" y1="70" x2="230" y2="108" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<rect x="60" y="110" width="340" height="40" rx="4" fill="#f4f5f8" stroke="#767d8a"/>
<text x="230" y="135" class="s" text-anchor="middle">widen ANSI → UTF-16LE (CRT mbstowcs chain)</text>

<circle cx="82" cy="176" r="11" fill="#18225c"/><text x="82" y="180.5" class="n" text-anchor="middle">2</text>
<line x1="230" y1="150" x2="230" y2="188" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<rect x="60" y="190" width="340" height="40" rx="4" fill="#f4f5f8" stroke="#767d8a"/>
<text x="230" y="215" class="s" text-anchor="middle">SHA-256 hash (CryptCreateHash + CryptHashData)</text>

<circle cx="82" cy="256" r="11" fill="#18225c"/><text x="82" y="260.5" class="n" text-anchor="middle">3</text>
<line x1="230" y1="230" x2="230" y2="268" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<rect x="60" y="270" width="340" height="40" rx="4" fill="#f4f5f8" stroke="#767d8a"/>
<text x="230" y="295" class="s" text-anchor="middle">truncate to first 16 bytes → AES-128 key</text>

<line x1="230" y1="310" x2="230" y2="350" stroke="#3a4590" stroke-width="1.8"/>
<line x1="230" y1="350" x2="480" y2="350" stroke="#3a4590" stroke-width="1.8"/>
<line x1="480" y1="350" x2="480" y2="378" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="355" y="344" class="s" text-anchor="middle">key</text>

<!-- Right stream: /update → ciphertext -->
<rect x="560" y="20" width="340" height="50" rx="8" stroke="#18225c" stroke-width="1.6" fill="#ffffff"/>
<text x="730" y="42" class="b" text-anchor="middle">/update response body</text>
<text x="730" y="57" class="s" text-anchor="middle">AES-encrypted PE</text>

<line x1="730" y1="70" x2="730" y2="350" stroke="#767d8a" stroke-width="1.2" stroke-dasharray="3 5"/>
<line x1="730" y1="350" x2="660" y2="350" stroke="#3a4590" stroke-width="1.8"/>
<line x1="660" y1="350" x2="660" y2="378" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="700" y="344" class="s" text-anchor="end">ciphertext</text>

<!-- Convergence: decrypt -->
<circle cx="502" cy="360" r="11" fill="#18225c"/><text x="502" y="364.5" class="n" text-anchor="middle">4</text>
<rect x="400" y="380" width="370" height="50" rx="8" stroke="#18225c" stroke-width="2.4" fill="#eef0fa"/>
<text x="585" y="402" class="b" text-anchor="middle">AES-128-CBC decrypt</text>
<text x="585" y="418" class="s" text-anchor="middle">zero IV · PKCS7 · 160-byte chunks · CryptDecrypt</text>

<circle cx="502" cy="456" r="11" fill="#18225c"/><text x="502" y="460.5" class="n" text-anchor="middle">5</text>
<line x1="585" y1="430" x2="585" y2="468" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<!-- Reflective load pipeline -->
<rect x="400" y="470" width="370" height="40" rx="4" fill="#f4f5f8" stroke="#767d8a"/>
<text x="585" y="495" class="s" text-anchor="middle">validate DOS + NT headers, allocate image region</text>

<circle cx="502" cy="536" r="11" fill="#18225c"/><text x="502" y="540.5" class="n" text-anchor="middle">6</text>
<line x1="585" y1="510" x2="585" y2="548" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<rect x="400" y="550" width="370" height="40" rx="4" fill="#f4f5f8" stroke="#767d8a"/>
<text x="585" y="575" class="s" text-anchor="middle">copy sections · resolve imports · base relocations</text>

<circle cx="502" cy="616" r="11" fill="#18225c"/><text x="502" y="620.5" class="n" text-anchor="middle">7</text>
<line x1="585" y1="590" x2="585" y2="628" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<rect x="400" y="630" width="370" height="40" rx="4" fill="#f4f5f8" stroke="#767d8a"/>
<text x="585" y="655" class="s" text-anchor="middle">VirtualProtect page protections · DllMain(ATTACH)</text>

<line x1="585" y1="670" x2="585" y2="698" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<rect x="400" y="700" width="370" height="18" rx="4" fill="none" stroke="none"/>
<text x="585" y="713" class="b" text-anchor="middle">resolve + call updateSW(url, campaign_id)</text>

<!-- Side annotations -->
<text x="40" y="360" class="a" text-anchor="start">no disk artifact</text>
<text x="40" y="376" class="a" text-anchor="start">at any point</text>

<rect x="790" y="470" width="150" height="200" rx="6" stroke="#767d8a" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
<text x="865" y="492" class="s" text-anchor="middle">hand-rolled</text>
<text x="865" y="508" class="s" text-anchor="middle">MemoryModule</text>
<text x="865" y="524" class="s" text-anchor="middle">PE loader</text>
<text x="865" y="552" class="s" text-anchor="middle">no WriteProcess-</text>
<text x="865" y="568" class="s" text-anchor="middle">Memory, no</text>
<text x="865" y="584" class="s" text-anchor="middle">CreateRemote-</text>
<text x="865" y="600" class="s" text-anchor="middle">Thread</text>
<text x="865" y="628" class="s" text-anchor="middle">in-process only</text>
</svg>