<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>GCleaner update payload fetch-drop-execute sequence</title>
<desc>The update payload receives the /service URL and campaign identifier from the loader, sends a single HTTP GET, optionally decodes the response through a COM component if a Content-Encoding header is present, applies a size gate, generates a randomised drop path under %APPDATA% or %TEMP%, writes the response to disk as an executable, and launches it with CreateProcessA falling back to ShellExecuteA.</desc>
<style>
.t{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;fill:#1c1e24}
.b{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;fill:#1c1e24}
.s{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#4a4f5c}
.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#1c1e24}
.a{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#8a5a00}
.n{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:#ffffff}
.r{font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#9e2b2b}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4590"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#767d8a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9e2b2b"/></marker></defs>
<rect x="0" y="0" width="960" height="780" fill="#ffffff"/>

<!-- Entry -->
<rect x="260" y="20" width="440" height="50" rx="8" stroke="#18225c" stroke-width="2.4" fill="#eef0fa"/>
<text x="480" y="42" class="b" text-anchor="middle">updateSW( url, campaign_id )</text>
<text x="480" y="57" class="s" text-anchor="middle">called by the loader at 0x40412d</text>

<circle cx="282" cy="96" r="11" fill="#18225c"/><text x="282" y="100.5" class="n" text-anchor="middle">1</text>
<line x1="480" y1="70" x2="480" y2="108" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<!-- HTTP GET -->
<rect x="260" y="110" width="440" height="50" rx="8" stroke="#18225c" stroke-width="1.6" fill="#ffffff"/>
<text x="480" y="132" class="b" text-anchor="middle">HTTP GET /service</text>
<text x="480" y="148" class="s" text-anchor="middle">port 80 · plain HTTP · same four Accept* headers as the loader</text>

<circle cx="282" cy="186" r="11" fill="#18225c"/><text x="282" y="190.5" class="n" text-anchor="middle">2</text>
<line x1="480" y1="160" x2="480" y2="198" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<!-- Read loop -->
<rect x="260" y="200" width="440" height="40" rx="4" fill="#f4f5f8" stroke="#767d8a"/>
<text x="480" y="225" class="s" text-anchor="middle">read response (InternetReadFile loop, growing buffer from 0x7800)</text>

<line x1="480" y1="240" x2="480" y2="278" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<!-- Content-Encoding decision -->
<polygon points="480,280 600,320 480,360 360,320" fill="#ffffff" stroke="#18225c" stroke-width="1.6"/>
<text x="480" y="317" class="s" text-anchor="middle">Content-Encoding</text>
<text x="480" y="333" class="s" text-anchor="middle">header present?</text>

<!-- Yes branch: COM decode -->
<line x1="600" y1="320" x2="730" y2="320" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="655" y="312" class="s" text-anchor="middle">yes</text>

<rect x="710" y="290" width="220" height="60" rx="8" stroke="#8a5a00" stroke-width="1.6" stroke-dasharray="6 4" fill="#fbf3e0"/>
<text x="820" y="314" class="a" text-anchor="middle">COM decode</text>
<text x="820" y="330" class="a" text-anchor="middle">CoCreateInstance</text>
<text x="820" y="346" class="a" text-anchor="middle">CLSID {70BDDE00-...}</text>

<line x1="820" y1="350" x2="820" y2="400" stroke="#8a5a00" stroke-width="1.4" stroke-dasharray="6 4"/>
<line x1="820" y1="400" x2="502" y2="400" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<!-- No branch: straight down -->
<line x1="480" y1="360" x2="480" y2="398" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="468" y="384" class="s" text-anchor="end">no</text>

<!-- Size gate -->
<polygon points="480,400 600,440 480,480 360,440" fill="#ffffff" stroke="#18225c" stroke-width="1.6"/>
<text x="480" y="437" class="s" text-anchor="middle">response</text>
<text x="480" y="453" class="s" text-anchor="middle">&gt; 0x800 bytes?</text>

<!-- Fail branch -->
<line x1="360" y1="440" x2="180" y2="440" stroke="#9e2b2b" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="280" y="432" class="r" text-anchor="middle">≤ 0x800</text>
<rect x="60" y="420" width="120" height="40" rx="6" stroke="#9e2b2b" stroke-width="1.4" fill="#fdf0f0"/>
<text x="120" y="445" class="r" text-anchor="middle">return −1</text>

<!-- Pass: random path generation -->
<circle cx="382" cy="506" r="11" fill="#18225c"/><text x="382" y="510.5" class="n" text-anchor="middle">3</text>
<line x1="480" y1="480" x2="480" y2="518" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="600" y="500" class="s" text-anchor="start">&gt; 0x800</text>

<rect x="260" y="520" width="440" height="50" rx="8" stroke="#18225c" stroke-width="1.6" fill="#ffffff"/>
<text x="480" y="542" class="b" text-anchor="middle">generate random drop path</text>
<text x="480" y="558" class="s" text-anchor="middle">84-char alphabet · rand() % 84 · 9–13 char directory name</text>

<circle cx="282" cy="596" r="11" fill="#18225c"/><text x="282" y="600.5" class="n" text-anchor="middle">4</text>
<line x1="480" y1="570" x2="480" y2="608" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<!-- Drop directory -->
<rect x="260" y="610" width="440" height="50" rx="8" stroke="#18225c" stroke-width="1.6" fill="#ffffff"/>
<text x="480" y="632" class="b" text-anchor="middle">%APPDATA%\&lt;random&gt;\&lt;random&gt;.exe</text>
<text x="480" y="648" class="s" text-anchor="middle">CreateDirectoryA · fallback to %TEMP% on failure</text>

<circle cx="282" cy="686" r="11" fill="#18225c"/><text x="282" y="690.5" class="n" text-anchor="middle">5</text>
<line x1="480" y1="660" x2="480" y2="698" stroke="#3a4590" stroke-width="1.8" marker-end="url(#ah)"/>

<!-- Write and launch -->
<rect x="260" y="700" width="440" height="50" rx="8" stroke="#18225c" stroke-width="2.4" fill="#eef0fa"/>
<text x="480" y="722" class="b" text-anchor="middle">write file + launch</text>
<text x="480" y="738" class="s" text-anchor="middle">CreateFileA/WriteFile → CreateProcessA (fallback ShellExecuteA "open")</text>

<!-- Side annotations -->
<text x="60" y="142" class="a" text-anchor="start">no IP, domain or URL</text>
<text x="60" y="158" class="a" text-anchor="start">of its own — target comes</text>
<text x="60" y="174" class="a" text-anchor="start">from the loader</text>

<text x="60" y="558" class="a" text-anchor="start">first moment an</text>
<text x="60" y="574" class="a" text-anchor="start">endpoint control</text>
<text x="60" y="590" class="a" text-anchor="start">has something to see</text>

<text x="740" y="568" class="s" text-anchor="start">no CryptoAPI</text>
<text x="740" y="584" class="s" text-anchor="start">no ADVAPI32.dll</text>
<text x="740" y="600" class="s" text-anchor="start">everything in the clear</text>
</svg>